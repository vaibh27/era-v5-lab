<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="How the drift was measured"><title>How the drift was measured</title><style>text{font-family:Inter, 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#1C1B19}.t{font-size:21px;font-weight:600;letter-spacing:-.012em}.st{font-size:12.5px;fill:#7A746A}.cap{font-size:10px;font-weight:600;letter-spacing:.14em;fill:#7A746A}.lab{font-size:12px;fill:#7A746A}.lab2{font-size:12.5px;font-weight:500}.n{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;font-variant-numeric:tabular-nums;font-size:12px}.big{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;font-variant-numeric:tabular-nums;font-size:34px;font-weight:500;letter-spacing:-.02em}.ax{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;font-size:10.5px;fill:#7A746A}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes show{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes breathe{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:.75;transform:scale(1.25)}}.g{transform-box:fill-box;transform-origin:left center;animation:grow 1.3s cubic-bezier(.22,.8,.24,1) both}.r{transform-box:fill-box;transform-origin:center bottom;animation:rise 1.1s cubic-bezier(.22,.8,.24,1) both}.f{animation:fade .9s cubic-bezier(.2,.7,.2,1) both}.s{animation:show .7s ease-out both}.d{stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.45,.05,.25,1) both}.b{transform-box:fill-box;transform-origin:center;animation:breathe 3.6s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="879" height="299" rx="16" fill="#FBFAF7" stroke="#E6E1D6"/><text x="36.0" y="44.0" class="cap" text-anchor="start" fill="#A9844B">HOW THE DRIFT WAS MEASURED</text><text x="36.0" y="72.0" class="t" text-anchor="start">TurboQuant is read only after the first prefill</text><text x="36.0" y="94.0" class="st" text-anchor="start">vLLM prefills a prompt on the exact K/V; the compressed cache is read by decode and by continuation chunks</text><text x="36.0" y="136.0" class="lab2" text-anchor="start">One-piece prefill · 1,024 tokens</text><rect x="36" y="146" width="808" height="24" rx="4" fill="#A9844B" opacity=".85" class="g" style="animation-delay:.2s"/><text x="844.0" y="136.0" class="lab" text-anchor="end">exact K/V everywhere: every preset looks identical, nothing measured</text><text x="36.0" y="210.0" class="lab2" text-anchor="start">Chunked prefill · 32 pieces of 32 tokens</text><text x="844.0" y="210.0" class="lab" text-anchor="end">later pieces attend through the compressed cache, as decode does</text><rect x="36.0" y="220" width="23.3" height="24" rx="3" fill="#A9844B" class="s" style="animation-delay:0.600s"/><rect x="61.3" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:0.635s"/><rect x="86.6" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:0.670s"/><rect x="111.9" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:0.705s"/><rect x="137.2" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:0.740s"/><rect x="162.6" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:0.775s"/><rect x="187.9" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:0.810s"/><rect x="213.2" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:0.845s"/><rect x="238.5" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:0.880s"/><rect x="263.8" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:0.915s"/><rect x="289.1" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:0.950s"/><rect x="314.4" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:0.985s"/><rect x="339.8" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.020s"/><rect x="365.1" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.055s"/><rect x="390.4" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.090s"/><rect x="415.7" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.125s"/><rect x="441.0" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.160s"/><rect x="466.3" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.195s"/><rect x="491.6" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.230s"/><rect x="516.9" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.265s"/><rect x="542.2" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.300s"/><rect x="567.6" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.335s"/><rect x="592.9" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.370s"/><rect x="618.2" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.405s"/><rect x="643.5" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.440s"/><rect x="668.8" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.475s"/><rect x="694.1" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.510s"/><rect x="719.4" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.545s"/><rect x="744.8" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.580s"/><rect x="770.1" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.615s"/><rect x="795.4" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.650s"/><rect x="820.7" y="220" width="23.3" height="24" rx="3" fill="#25324E" class="s" style="animation-delay:1.685s"/><rect x="36" y="265" width="12" height="10" rx="2" fill="#A9844B"/><text x="54.0" y="274.0" class="lab" text-anchor="start">exact K/V (flash-attn)</text><rect x="206" y="265" width="12" height="10" rx="2" fill="#25324E"/><text x="224.0" y="274.0" class="lab" text-anchor="start">TurboQuant decode kernel over the compressed cache (continuation q_len ≤ 128)</text></svg>
