<svg xmlns="http://www.w3.org/2000/svg" width="880" height="446" viewBox="0 0 880 446" role="img" aria-label="Capacity against drift in vLLM 0.33.0 on sarvam-1"><title>Capacity against drift in vLLM 0.33.0 on sarvam-1</title><style>text{font-family:Inter, 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#ECE8E0}.t{font-size:21px;font-weight:600;letter-spacing:-.012em}.st{font-size:12.5px;fill:#9A958A}.cap{font-size:10px;font-weight:600;letter-spacing:.14em;fill:#9A958A}.lab{font-size:12px;fill:#9A958A}.lab2{font-size:12.5px;font-weight:500}.n{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;font-variant-numeric:tabular-nums;font-size:12px}.big{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;font-variant-numeric:tabular-nums;font-size:34px;font-weight:500;letter-spacing:-.02em}.ax{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;font-size:10.5px;fill:#9A958A}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes show{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes breathe{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:.75;transform:scale(1.25)}}.g{transform-box:fill-box;transform-origin:left center;animation:grow 1.3s cubic-bezier(.22,.8,.24,1) both}.r{transform-box:fill-box;transform-origin:center bottom;animation:rise 1.1s cubic-bezier(.22,.8,.24,1) both}.f{animation:fade .9s cubic-bezier(.2,.7,.2,1) both}.s{animation:show .7s ease-out both}.d{stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.45,.05,.25,1) both}.b{transform-box:fill-box;transform-origin:center;animation:breathe 3.6s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</s