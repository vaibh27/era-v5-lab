<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" role="img" aria-label="Four findings of the KV-cache emulation"><title>Four findings of the KV-cache emulation</title><style>text{font-family:Inter, 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#ECE8E0}.t{font-size:21px;font-weight:600;letter-spacing:-.012em}.st{font-size:12.5px;fill:#9A958A}.cap{font-size:10px;font-weight:600;letter-spacing:.14em;fill:#9A958A}.lab{font-size:12px;fill:#9A958A}.lab2{font-size:12.5px;font-weight:500}.n{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;font-variant-numeric:tabular-nums;font-size:12px}.big{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;font-variant-numeric:tabular-nums;font-size:34px;font-weight:500;letter-spacing:-.02em}.ax{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;font-size:10.5px;fill:#9A958A}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes show{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes breathe{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:.75;transform:scale(1.25)}}.g{transform-box:fill-box;transform-origin:left center;animation:grow 1.3s cubic-bezier(.22,.8,.24,1) both}.r{transform-box:fill-box;transform-origin:center bottom;animation:rise 1.1s cubic-bezier(.22,.8,.24,1) both}.f{animation:fade .9s cubic-bezier(.2,.7,.2,1) both}.s{animation:show .7s ease-out both}.d{stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.45,.05,.25,1) both}.b{transform-box:fill-box;transform-origin:center;animation:breathe 3.6s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="879" height="371" rx="16" fill="#0F1115" stroke="#272B33"/><text x="36.0" y="44.0" class="cap" text-anchor="start" fill="#D3AF73">EMULATION · KVQ_STUDY.PY · SARVAM-1</text><text x="36.0" y="72.0" class="t" text-anchor="start">Four things the emulation shows</text><text x="36.0" y="94.0" class="st" text-anchor="start">Mean KL(base ‖ quant) in nats over the documents; lower is better</text><g class="f" style="animation-delay:0.20s"><rect x="36" y="116" width="396" height="118" rx="12" fill="#15181D" stroke="#272B33"/><text x="54" y="142" class="cap">KEYS MATTER MORE · 5.45 BITS</text></g><text x="54.0" y="171.0" class="lab" text-anchor="start">4-bit keys, 3-bit values</text><rect x="204" y="160" width="86.5" height="14" rx="3" fill="#88B9A5" class="g" style="animation-delay:0.45s"/><text x="298.5" y="171.0" class="n" text-anchor="start">0.0274</text><text x="54.0" y="197.0" class="lab" text-anchor="start">k3v4_nc (vLLM)</text><rect x="204" y="186" width="146.0" height="14" rx="3" fill="#8396BC" class="g" style="animation-delay:0.55s"/><text x="358.0" y="197.0" class="n" text-anchor="start">0.0462</text><text x="54.0" y="220.0" class="n" text-anchor="start" fill="#9A958A">41% less KL; not a vLLM preset</text><g class="f" style="animation-delay:0.35s"><rect x="448" y="116" width="396" height="118" rx="12" fill="#15181D" stroke="#272B33"/><text x="466" y="142" class="cap">QJL HURTS ATTENTION</text></g><text x="466.0" y="171.0" class="lab" text-anchor="start">TurboQuant-MSE, 4-bit</text><rect x="616" y="160" width="32.7" height="14" rx="3" fill="#88B9A5" class="g" style="animation-delay:0.60s"/><text x="656.7" y="171.0" class="n" text-anchor="start">0.0166</text><text x="466.0" y="197.0" class="lab" text-anchor="start">TurboQuant-prod (QJL)</text><rect x="616" y="186" width="146.0" height="14" rx="3" fill="#D9978A" class="g" style="animation-delay:0.70s"/><text x="770.0" y="197.0" class="n" text-anchor="start">0.0743</text><text x="466.0" y="220.0" class="n" text-anchor="start" fill="#9A958A">4.5× the KL; vLLM leaves it out</text><g class="f" style="animation-delay:0.50s"><rect x="36" y="248" width="396" height="118" rx="12" fill="#15181D" stroke="#272B33"/><text x="54" y="274" class="cap">NORM CORRECTION IS FREE</text></g><text x="54.0" y="303.0" class="lab" text-anchor="start">tq4 + _nc</text><rect x="204" y="292" width="122.4" height="14" rx="3" fill="#88B9A5" class="g" style="animation-delay:0.75s"/><text x="334.4" y="303.0" class="n" text-anchor="start">0.0140</text><text x="54.0" y="329.0" class="lab" text-anchor="start">tq4</text><rect x="204" y="318" width="146.0" height="14" rx="3" fill="#8396BC" class="g" style="animation-delay:0.85s"/><text x="358.0" y="329.0" class="n" text-anchor="start">0.0166</text><text x="54.0" y="352.0" class="n" text-anchor="start" fill="#9A958A">16% less KL at no extra bits</text><g class="f" style="animation-delay:0.65s"><rect x="448" y="248" width="396" height="118" rx="12" fill="#15181D" stroke="#272B33"/><text x="466" y="274" class="cap">ROTATION BEATS PLAIN INT4</text></g><text x="466.0" y="303.0" class="lab" text-anchor="start">TurboQuant 4-bit</text><rect x="616" y="292" width="35.3" height="14" rx="3" fill="#88B9A5" class="g" style="animation-delay:0.90s"/><text x="659.3" y="303.0" class="n" text-anchor="start">0.0168</text><text x="466.0" y="329.0" class="lab" text-anchor="start">int4 absmax</text><rect x="616" y="318" width="146.0" height="14" rx="3" fill="#D9978A" class="g" style="animation-delay:1.00s"/><text x="770.0" y="329.0" class="n" text-anchor="start">0.0695</text><text x="466.0" y="352.0" class="n" text-anchor="start" fill="#9A958A">4.1× lower KL at the same 4 bits</text></svg>
