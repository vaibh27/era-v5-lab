<svg xmlns="http://www.w3.org/2000/svg" width="880" height="286" viewBox="0 0 880 286" role="img" aria-label="KV-cache quantization at a glance"><title>KV-cache quantization at a glance</title><style>text{font-family:Inter, 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#1C1B19}.t{font-size:21px;font-weight:600;letter-spacing:-.012em}.st{font-size:12.5px;fill:#7A746A}.cap{font-size:10px;font-weight:600;letter-spacing:.14em;fill:#7A746A}.lab{font-size:12px;fill:#7A746A}.lab2{font-size:12.5px;font-weight:500}.n{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;font-variant-numeric:tabular-nums;font-size:12px}.big{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;font-variant-numeric:tabular-nums;font-size:34px;font-weight:500;letter-spacing:-.02em}.ax{font-family:'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;font-size:10.5px;fill:#7A746A}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes show{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes breathe{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:.75;transform:scale(1.25)}}.g{transform-box:fill-box;transform-origin:left center;animation:grow 1.3s cubic-bezier(.22,.8,.24,1) both}.r{transform-box:fill-box;transform-origin:center bottom;animation:rise 1.1s cubic-bezier(.22,.8,.24,1) both}.f{animation:fade .9s cubic-bezier(.2,.7,.2,1) both}.s{animation:show .7s ease-out both}.d{stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.45,.05,.25,1) both}.b{transform-box:fill-box;transform-origin:center;animation:breathe 3.6s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="879" height="285" rx="16" fill="#FBFAF7" stroke="#E6E1D6"/><text x="36.0" y="46.0" class="cap" text-anchor="start" fill="#A9844B">TEAM 12 · SERVING · KV CACHE</text><text x="36.0" y="78.0" class="t" text-anchor="start" style="font-size:25px">How far can the KV cache shrink?</text><text x="36.0" y="102.0" class="st" text-anchor="start">fp8 and TurboQuant in vLLM 0.33.0 · sarvam-1 as a proxy · one NVIDIA L4 per dtype</text><rect x="36" y="116" width="64" height="2" rx="1" fill="#A9844B" class="g"/><g class="f" style="animation-delay:0.25s"><rect x="36" y="140" width="258" height="118" rx="12" fill="#FFFFFF" stroke="#E6E1D6"/><rect x="36" y="158" width="3" height="82" rx="1.5" fill="#5C8B79"/><text x="56" y="170" class="cap">FP8 · THE SAFE FIRST STEP</text><text x="56" y="212" class="big" fill="#5C8B79">1.94×</text><text x="56" y="232" class="lab">KV tokens against bf16</text><text x="56" y="248" class="n" fill="#7A746A">ΔNLL ≈ 0 · +19% tok/s</text></g><g class="f" style="animation-delay:0.43s"><rect x="309" y="140" width="258" height="118" rx="12" fill="#FFFFFF" stroke="#E6E1D6"/><rect x="309" y="158" width="3" height="82" rx="1.5" fill="#25324E"/><text x="329" y="170" class="cap">TURBOQUANT 4BIT_NC · SARVAM-1</text><text x="329" y="212" class="big" fill="#25324E">2.73×</text><text x="329" y="232" class="lab">not the 3.8× of its docstring</text><text x="329" y="248" class="n" fill="#7A746A">ΔNLL +0.011 · −4% tok/s</text></g><g class="f" style="animation-delay:0.61s"><rect x="582" y="140" width="258" height="118" rx="12" fill="#FFFFFF" stroke="#E6E1D6"/><rect x="582" y="158" width="3" height="82" rx="1.5" fill="#B5705F"/><text x="602" y="170" class="cap">TURBOQUANT 4BIT_NC · OUR T2</text><text x="602" y="212" class="big" fill="#B5705F">1.57×</text><text x="602" y="232" class="lab">below fp8’s 2.00× (computed)</text><text x="602" y="248" class="n" fill="#7A746A">4 of 8 layers stay bf16</text></g></svg>
