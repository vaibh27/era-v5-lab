<text x="24.0" y="404.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Nirmala UI', 'Noto Sans', sans-serif" font-size="13" font-weight="400" fill="#3f5260" text-anchor="start">Every start begins with 95, a continuation byte with nothing before it, so no cut is valid and the cut string is empty (Lemma 2 (f)).</text><text x="24.0" y="422.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Nirmala UI', 'Noto Sans', sans-serif" font-size="13" font-weight="400" fill="#3f5260" text-anchor="start">The proposed rule τ′ in proof.md would keep 30 bytes of this token instead.</text>
<text x="24.0" y="456.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Nirmala UI', 'Noto Sans', sans-serif" font-size="12" font-weight="400" fill="#667884" text-anchor="start">No BrahmicTokenizer token is longer than 32 bytes, so at P = 32 and P = 64 neither rule cuts anything (Lemma 2 (b)). Both cases matter only for another tokenizer or a smaller P.</text>
