# Laptop smoke test (CPU, about 10 seconds): a random tiny OLMoE learns the toy task with its router frozen.
# Proves the loop learns end to end; not a real training run.
seed: 1234
device: cpu
out_dir: out/smoke_tiny_olmoe
model:
  kind: tiny_olmoe
  config: {vocab_size: 16, hidden_size: 32, intermediate_size: 32, num_hidden_layers: 2, num_attention_heads: 4,
           num_key_value_heads: 4, num_experts: 4, num_experts_per_tok: 2, max_position_embeddings: 64}
task: {kind: toy, vocab: 16, prompt_len: 4, offset: 3, n_train: 256, n_heldout: 64}
train:
  algo: grpo
  steps: 80
  prompts_per_step: 16
  k: 8
  max_new: 2
  temperature: 1.0
  lr: 0.01
  clip_eps: 0.2
  ppo_epochs: 4
  kl_coef: 0.0
  eval_every: 20
  eval_k: 8
