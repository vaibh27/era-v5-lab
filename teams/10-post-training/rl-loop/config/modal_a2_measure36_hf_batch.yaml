# A2 (#36's question) on H100!: #36's settings (20 steps, 8 prompts, k 8, 64 new tokens, attention only), sampler hf_batch.
seed: 1234
device: cuda
model:
  kind: hf
  path: /vol/hf/allenai/OLMoE-1B-7B-0125-Instruct
  dtype: bfloat16
  stop_at_eos: true
task: {kind: toy, rule: parity, vocab: 50304, prompt_len: 8, n_train: 256, n_heldout: 32}
train: {algo: grpo, steps: 20, prompts_per_step: 8, k: 8, max_new: 64, temperature: 1.0, lr: 1.0e-6, clip_eps: 0.2,
        ppo_epochs: 1, kl_coef: 0.0, trainable: ['\.self_attn\.'], eval_every: 10, eval_k: 2, sampler: hf_batch,
        vllm: {gpu_memory_utilization: 0.3, max_model_len: 2048}, tis_clip: 2.0, routing_log: true, routing_probe: 8}
